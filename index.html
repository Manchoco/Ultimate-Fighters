<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0820" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Ultimate Fighters — jeu de combat 2D dans les grands lieux de Côte d'Ivoire. Jouable sur PC et téléphone." />
  <title>Ultimate Fighters</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/icon.png" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0820; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { position: fixed; inset: 0; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b0820; color: #fff; font: 600 20px system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">Touche l'écran pour jouer en plein écran.<br>(Sinon, tourne ton téléphone en mode paysage.)</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
